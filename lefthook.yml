# Git hooks. Install once with `lefthook install`.
#
# These are the same gates CI runs (.github/workflows/checks.yaml); running them here means a red
# build is found before the push rather than after it. The tree is at zero: keep it there.
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.luau"
      # Vendored code keeps its upstream form; explicit file arguments bypass .styluaignore.
      exclude:
        - "tests/reference/*"
      run: stylua --check {staged_files}
    lint:
      glob: "*.luau"
      # Mirrors selene.toml's exclude list: explicit file arguments bypass it.
      exclude:
        - "tests/reference/*"
      run: selene {staged_files}
    types:
      glob: "*.luau"
      # Whole project: luau-lsp needs every module's requires, not the staged subset.
      run: sh scripts/type-check.sh
    strict-mode:
      glob: "*.luau"
      run: sh scripts/check-strict.sh {staged_files}
    file-size:
      glob: "*.luau"
      # 300 lines, no exceptions: a file that reaches it is split into modules, not listed.
      run: sh scripts/check-file-size.sh {staged_files}
    english-only:
      run: sh scripts/check-english.sh {staged_files}

pre-push:
  commands:
    tests:
      run: sh scripts/run-tests.sh
    bench:
      # Saving must never spike a frame: each benchmark has a budget (bench/Run.luau).
      run: sh scripts/run-bench.sh
