# The same gates lefthook runs before a commit, plus the test suite. Keep the two in step.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: CompeyDev/setup-rokit@v0.2.1

      - name: Format
        run: stylua --check src tests bench

      - name: Lint
        run: selene src tests bench

      - name: Strict mode
        run: sh scripts/check-strict.sh

      - name: File size
        run: sh scripts/check-file-size.sh

      - name: English only
        run: sh scripts/check-english.sh

      - name: Types
        run: sh scripts/type-check.sh

      - name: Packages
        run: sh scripts/check-package.sh

      - name: Tests
        run: sh scripts/run-tests.sh

      - name: Benchmarks
        run: sh scripts/run-bench.sh

  # The docs site deploys only from main (docs.yml), so building it here puts a broken page or a dead
  # link before review. The link validator fails the build on a dead internal link.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: ./docs
        run: npm ci

      - name: Build
        working-directory: ./docs
        run: npm run build
