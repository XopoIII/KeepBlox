# A pushed tag drafts the release: the model is built and attached, and the notes start from the
# changelog entry. The draft is then filled in by hand (summary, docs link, Evidence, Known-not-fixed,
# Install — see CLAUDE.md) and published; wally and pesde are published after it, also by hand,
# because a published package version cannot be replaced.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: CompeyDev/setup-rokit@v0.2.1

      - name: The tag names the tree's version
        run: |
          sh scripts/check-version.sh
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' wally.toml)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "the tag $GITHUB_REF_NAME does not name the tree's version ($version)" >&2
            exit 1
          fi

      - name: Build the model
        run: rojo build -o KeepBlox.rbxm

      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## " version " - " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" KeepBlox.rbxm \
            --draft --title "KeepBlox $version" --notes-file notes.md
